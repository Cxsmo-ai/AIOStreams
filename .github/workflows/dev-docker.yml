name: Dev Docker Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch name or PR number (e.g. my-feature or 42)'
        required: true
        type: string
      tag:
        description: 'Override the image tag (optional, default: pr-<N> or <branch-name>)'
        required: false
        type: string

jobs:
  setup:
    name: Resolve ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve ref and tag
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$INPUT_REF" || "$INPUT_REF" == *$'\n'* || "$INPUT_REF" == *$'\r'* ]]; then
            echo "Invalid Git ref" >&2
            exit 1
          fi

          if [[ "$INPUT_REF" =~ ^[0-9]+$ ]]; then
            RESOLVED_REF="refs/pull/${INPUT_REF}/merge"
            DEFAULT_TAG="pr-${INPUT_REF}"
          else
            if ! git check-ref-format "refs/heads/${INPUT_REF}" >/dev/null; then
              echo "Invalid Git branch name" >&2
              exit 1
            fi
            RESOLVED_REF="${INPUT_REF}"
            # Strip conventional prefixes (feat/, fix/, chore/, etc.), then sanitise
            STRIPPED=$(echo "$INPUT_REF" | sed -E 's|^[a-z]+/||')
            SAFE=$(echo "$STRIPPED" | tr '/' '-' | tr -cd 'a-zA-Z0-9._-' | sed 's/^-*//')
            DEFAULT_TAG="${SAFE}"
          fi

          FINAL_TAG="${INPUT_TAG:-$DEFAULT_TAG}"

          # Docker tags are limited to 128 characters and a restricted alphabet.
          # Validate user overrides before they reach build arguments or scripts.
          if [[ ! "$FINAL_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag" >&2
            exit 1
          fi

          # Keep development builds from moving mutable release channels or
          # colliding with stable/nightly tags published by deploy-docker.yml.
          if [[ "$FINAL_TAG" == "latest" ||
                "$FINAL_TAG" == "nightly" ||
                "$FINAL_TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ||
                "$FINAL_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly$ ||
                "$FINAL_TAG" =~ ^main-[0-9a-f]{7}$ ]]; then
            echo "Development builds cannot overwrite release tags" >&2
            exit 1
          fi

          printf 'ref=%s\n' "$RESOLVED_REF" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$FINAL_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved ref: ${RESOLVED_REF}, tag: ghcr.io/${{ github.repository_owner }}/aiostreams:${FINAL_TAG}"

  build:
    name: build (${{ matrix.suffix }})
    needs: setup
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get commit hash
        id: commit
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Generate metadata
        env:
          BUILD_REF: ${{ needs.setup.outputs.tag }}
          BUILD_COMMIT: ${{ steps.commit.outputs.sha }}
        run: node scripts/generateMetadata.cjs --channel=dev --ref="$BUILD_REF" --commit="$BUILD_COMMIT"

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: true
          context: .
          file: ./Dockerfile
          build-args: |
            AIOSTREAMS_BUILD_CHANNEL=dev
            AIOSTREAMS_BUILD_REF=${{ needs.setup.outputs.tag }}
            AIOSTREAMS_BUILD_COMMIT=${{ steps.commit.outputs.sha }}
          outputs: type=image,name=ghcr.io/${{ env.REPO }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Export digest
        run: echo "${{ steps.build.outputs.digest }}" > "/tmp/${{ matrix.suffix }}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/${{ matrix.suffix }}
          archive: false
          retention-days: 1

  merge:
    name: Merge manifests
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: '{amd64,arm64}'
          merge-multiple: true

      - name: Set lower case repository name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/${REPO}:${TAG}" \
            "ghcr.io/${REPO}@$(cat /tmp/digests/amd64)" \
            "ghcr.io/${REPO}@$(cat /tmp/digests/arm64)"
