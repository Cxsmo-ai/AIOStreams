packages:
  - packages/*

overrides:
  compression: 1.8.2
  # Upstream's security-only 6.x backport for Tailwind 3; GHSA version range
  # still flags 6.1.5, although the 6.1.5 release marks it as patched.
  postcss-selector-parser@6: 6.1.5
  zod@3.22.0: 3.22.3

allowBuilds:
  '@webos-tools/cli': false
  bcrypt: true
  better-sqlite3: true
  core-js: true
  cpu-features: false
  esbuild: true
  sharp: true
  sqlite3: true
  ssh2: false
  unrs-resolver: true
  yencode: true

patchedDependencies:
  stremthru: patches/stremthru.patch
  yencode@1.2.4: patches/yencode@1.2.4.patch
